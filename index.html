<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Track your daily expenses easily</p>
        </header>

        <!-- Summary -->
        <section class="summary">
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Transactions</h3>
                <p id="totalTransactions">0</p>
            </div>

            <div class="summary-card">
                <h3>Average Expense</h3>
                <p id="averageExpense">₹0.00</p>
            </div>
        </section>

        <!-- Add Expense -->
        <section class="expense-form-section">
            <h2 id="formTitle">Add Expense</h2>

            <form id="expenseForm">

                <input type="hidden" id="expenseId">

                <div class="form-group">
                    <label for="title">Expense Name</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. College Canteen"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Travel">🚌 Travel</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Education">📚 Education</option>
                        <option value="Entertainment">🎮 Entertainment</option>
                        <option value="Bills">💡 Bills</option>
                        <option value="Health">🏥 Health</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        rows="3"
                        placeholder="Optional description"
                    ></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary" id="submitBtn">
                        ➕ Add Expense
                    </button>

                    <button
                        type="button"
                        class="btn-secondary hidden"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>
                </div>

            </form>
        </section>

        <!-- Filters -->
        <section class="filters">

            <h2>🔎 Filter Expenses</h2>

            <div class="filter-grid">

                <div>
                    <label for="categoryFilter">Category</label>

                    <select id="categoryFilter">
                        <option value="All">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div>
                    <label for="dateFilter">Filter by Date</label>

                    <input type="date" id="dateFilter">
                </div>

                <div>
                    <label for="searchInput">Search</label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search expenses..."
                    >
                </div>

                <div class="reset-container">
                    <button id="resetFilters" class="reset-btn">
                        🔄 Reset
                    </button>
                </div>

            </div>

        </section>

        <!-- Expense List -->
        <section class="expense-section">

            <div class="section-header">
                <h2>📋 Expense List</h2>

                <button id="clearAll" class="clear-btn">
                    🗑️ Clear All
                </button>
            </div>

            <div id="expenseList" class="expense-list"></div>

            <div id="emptyMessage" class="empty-message">
                <div>💸</div>
                <h3>No expenses found</h3>
                <p>Add your first expense to start tracking.</p>
            </div>

        </section>

        <footer>
            <p>Expense Tracker © 2026 | Built with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
